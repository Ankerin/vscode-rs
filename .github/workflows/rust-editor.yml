name: Rust Editor

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rust/**'
      - 'build/rust/**'
      - 'test/rust/**'
      - 'src/vs/editor/common/model/**'
      - 'src/vs/editor/browser/model/**'
      - 'src/vs/editor/common/services/**'
      - 'src/vs/editor/common/diff/**'
      - 'src/vs/editor/common/core/**'
      - 'src/vs/editor/browser/services/**'
      - 'src/vs/editor/test/common/services/editorWebWorker.test.ts'
      - 'src/vs/workbench/electron-browser/desktop.main.ts'
      - 'src/vs/platform/environment/**/argv.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'build/package.json'
      - 'build/pnpm-lock.yaml'
      - '.github/workflows/rust-editor.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test native core
        run: cargo test --workspace --locked

  compatibility:
    name: WebAssembly Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: corepack enable pnpm
      - name: Install test dependencies
        run: |
          pnpm install --ignore-scripts --frozen-lockfile
          pnpm -C build install --ignore-scripts --frozen-lockfile
      - name: Select pinned Rust toolchain
        run: rustup show
        working-directory: rust
      - name: Install matching WebAssembly generator
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
        working-directory: rust
      - name: Build bindings
        run: pnpm run build-rust-editor
      - name: Check test types
        run: pnpm exec tsc --project test/rust/tsconfig.json --noEmit --skipLibCheck
      - name: Compare existing and Rust models
        run: pnpm run test-rust-editor
      - name: Install Chromium for browser worker compatibility
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify browser worker loading and lifecycle
        run: pnpm run test-rust-editor -- --browser
      - name: Build current client for canonical model suites
        run: pnpm run build-fast --client-only
      - name: Restore generated bindings after client build
        run: pnpm run build-rust-editor
      - name: Run canonical model suites with both storage implementations
        run: pnpm run test-rust-editor-models
